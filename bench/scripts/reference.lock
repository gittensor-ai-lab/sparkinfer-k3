# ---------------------------------------------------------------------------------------
# Kimi K3 (2.8T / A50B) baseline — UD-Q2_K_XL at 1M context across three nodes.
#
# The reference engine here is a FORK, not ggml-org/llama.cpp. That is not a convenience:
# K3 has 896 routed experts and upstream asserts n_expert <= LLAMA_MAX_EXPERTS (512), so
# upstream cannot load the model and there is no upstream number to compare against. The
# unsloth fork raises the cap to 1024 and adds LLM_ARCH_KIMI_K3.
#
# Because the pin is a PR head on a fork, fetch-by-sha is refused by GitHub, so we fetch
# KIMI_K3_LLAMACPP_REF and then assert it resolves to KIMI_K3_LLAMACPP_COMMIT. A
# force-push to the PR branch therefore FAILS the run instead of silently changing the
# baseline. Exported into LLAMACPP_* by kimi_k3_baseline.sh, so the Qwen evals keep using
# the upstream pin above and nothing here can leak into them.
KIMI_K3_LLAMACPP_REPO="${KIMI_K3_LLAMACPP_REPO:-https://github.com/unslothai/llama.cpp}"
KIMI_K3_LLAMACPP_REF="${KIMI_K3_LLAMACPP_REF:-refs/pull/48/head}"
KIMI_K3_LLAMACPP_COMMIT="${KIMI_K3_LLAMACPP_COMMIT:-efc8bc38f0a9950cbb10ccef2cf48b951c39d3b2}"
# PR #48 = "kimi-k3: full-size model fixes and the MoonViT-3d vision tower", on top of the
# kimi-k3-text-base branch (cf67f0d24511864d2d3da0769108fd6fc16d00d1). The two commits it
# adds are the ones that make the FULL-SIZE model correct rather than merely loadable:
#   47c5bbdf  make expert_latent_length / attn_res.block_size / situ betas REQUIRED KV keys
#             (they defaulted silently before, which loads cleanly and produces garbage);
#             raise graph_max_nodes to n_tokens*160 (the generic *40 dies at ubatch 3840);
#             reject the 0xff NaN E8M0 MXFP4 scale byte at conversion time
#   efc8bc38  MoonViT-3d vision tower (non-square fused QKV, RMSNorm, post-norm projector)
KIMI_K3_LLAMACPP_BASE_COMMIT="${KIMI_K3_LLAMACPP_BASE_COMMIT:-cf67f0d24511864d2d3da0769108fd6fc16d00d1}"

# Target quant is UD-Q2_K_XL (802 GiB, 90.4% top-1 vs lossless) — the accuracy knee.
# UD-IQ1_S is 249 GiB smaller but drops to 78.9% top-1, too lossy to judge a frontier on.
# Sharded weights are pinned by manifest file, not a single sha — see
# bench/scripts/kimi_k3_ud_q2_k_xl.sha256 (absent = warn-only, matching MODEL_SHA256).

# Baselines are pinned PER NODE, not once. The three hardware milestones run the SAME quant
# at the SAME 1M context, so the node is the only variable and a single set of slots would
# silently overwrite one milestone's reference with another's. kimi_k3_baseline.sh selects
# the prefix from KIMI_K3_NODE.
#
#   M1  KIMI_K3_H200X8_*   8x H200 SXM   141 GB  sm_90    1128 GiB
#   M2  KIMI_K3_B200X8_*   8x B200 SXM   180 GB  sm_100   1440 GiB
#   M3  KIMI_K3_B300X4_*   4x+ B300      288 GB  sm_103   1152 GiB  (arch unverified)
#
# 0 = NOT MEASURED. kimi_k3_baseline.sh writes these; do not hand-fill them — downstream a
# hand-filled baseline is indistinguishable from a measured one. _1M slots are single-rep
# capability probes, not medians: a 1M-token prefill is minutes of wall-clock per rep.

# --- M1: 8x H200 SXM (sm_90) ---
# --- MEASURED 2026-07-31, 8x H200 SXM, UD-IQ1_S ---
# The Q2_K_XL slots below stay 0: they are the TARGET quant and it has not been run.
# An IQ1_S number pinned into a Q2_K_XL slot would be scored against the wrong
# reference — IQ1_S is 249 GiB smaller and decodes faster, so it would understate every
# future gain. Quant-qualified slots instead.
#
# llama-bench -p 0 -n 64 -r 1 -ngl 99 --split-mode layer --load-mode none -b 2048 -ub 512
# engine: unslothai/llama.cpp @ efc8bc38 (refs/pull/48/head)
# backing: bench/results/kimi_k3_UD-IQ1_S_h200x8_baseline_20260731T021213Z.json
#
# THE HEADLINE, RECORDED SO IT IS NOT LOST: llama.cpp does 18.32 tok/s here and
# sparkinfer does 3.55. sparkinfer's K3 path is ~5.2x SLOWER than the reference. That
# is the expected shape for a correctness-first fp32 executor against llama.cpp's
# mature CUDA path (integer dot products, fused ops, graph capture) — but it means the
# K3 frontier starts far behind, and every tier below is anchored to 18.32.
KIMI_K3_H200X8_IQ1S_LLAMA_128="${KIMI_K3_H200X8_IQ1S_LLAMA_128:-18.3210}"
# sparkinfer at ctx 64. HISTORICAL — NOT THE SCORED CONTEXT, AND NO LONGER MAINTAINED.
# The bot writes only the _128K slot now, so nothing will ever update this one again; it is
# frozen deliberately rather than left to rot at a value that quietly goes wrong. 10.34 was
# measured on main @ 37d4219 (post-#20, post-#33) on 2026-08-01, same box and quant as the
# 128k number below. Kept because the pair is the point: 10.34 -> 1.00 is what scoring at
# 64 was hiding.
KIMI_K3_H200X8_IQ1S_SPARKINFER_128="${KIMI_K3_H200X8_IQ1S_SPARKINFER_128:-10.34}"

# --- THE SCORED CONTEXT: 128k (131,072) ---
#
# Everything above at _128 is decode from an effectively empty cache, and it is NOT what
# this repo scores on any more. CONTRIBUTING has always said 128k is "the configuration
# this repo runs"; until now nothing measured it — kimi_k3_tp_bench hardcoded max_ctx=64,
# so the slot said 128, the doc said 128k, and the hardware saw 64.
#
# WHY IT MATTERS, in one comparison. 8x H200, UD-IQ1_S, same weights:
#
#              depth 0/64   depth 131,072   lost
#   llama.cpp     18.32         18.44        ~0%   (3 reps, 2026-08-03)
#   sparkinfer    10.34          1.01       -90%   (as first measured, 2026-08-01)
#
# llama.cpp keeps a compressed MLA cache (kv_lora 512, f16); sparkinfer reduced over 576
# f32 per token in a kernel with one block per head. Scoring at 64 hid an 18x gap behind
# a 1.8x one, and pointed the incentive at a context nobody runs.
#
# THE -8% DEPTH FALLOFF PREVIOUSLY RECORDED HERE WAS A MEASUREMENT ARTEFACT. It came from a
# single rep (llama-bench -r 1) taken on a different box on 2026-08-01. Re-measured with 3
# reps on the box that scores every PR, llama.cpp holds its decode rate essentially flat
# from depth 0 to 131,072 (18.32 -> 18.44). It is sparkinfer that fell off a cliff with
# depth, not llama.cpp -- and the corrected reference makes that comparison honest rather
# than flattering.
#
# THE TWO SIDES ARE NOT MEASURED THE SAME WAY, and that belongs here rather than in a commit
# message. llama.cpp prefills 131,072 REAL tokens (llama-bench -d). sparkinfer has no
# prefill path — a genuine fill is ~10 h of sequential forward_token calls — so it allocates
# the cache at 131,072, leaves it ZEROED, and seeks position (--ctx/--seek in
# kimi_k3_tp_bench). For decode TIMING these are equivalent: the MLA reduction is dense and
# value-independent. For CORRECTNESS they are not, which is why the accuracy gate still runs
# at short context against bench/refdata/ and never at 128k.
#
# Tier basis. Backed by bench/results/kimi_k3_UD-IQ1_S_h200x8_baseline_20260803T084547Z.json:
# 3 reps at the scored context, on the SAME BOX that measures every frontier it is compared
# against. That last part is the point. The previous 16.7026 was a single rep from a
# different machine on 2026-08-01, so the tier basis divided deltas measured here by a
# reference measured there -- and box-to-box spread on this hardware is several percent
# (main itself read 18.14 pinned vs 18.88 measured when the box changed). A llama-anchored
# tier is only meaningful when both halves come off the same metal.
#
# Raising it 16.7026 -> 18.4435 makes every tier ~9.4% SMALLER, because the tier basis is
# delta/llama_ref. Nothing about anyone's measured speed changed; the yardstick was wrong.
KIMI_K3_H200X8_IQ1S_LLAMA_128K="${KIMI_K3_H200X8_IQ1S_LLAMA_128K:-18.4435}"
# frontier at the scored context. eval/k3_eval_bot.py rewrites this each round; it is
# raise-only, so a slow box cannot deflate it and mint tiers for everyone behind it.
# 1.00 tok/s (995.65 ms/token) measured on main @ 37d4219 via the committed --ctx/--seek
# path, which reproduces the throwaway seek_patch.py measurement (1.01 / 991.75) to 0.4%.
#
# SET TO 56.8 BY HAND ON 2026-08-05, deliberately, because this slot stopped being the tier
# basis and became the DECODE REGRESSION GUARD's baseline (#131).
#
# It read 46.48 while main did ~56.8: #127 (+23.2%) merged outside a round, so no round had
# re-measured. As the tier basis a stale-low pin only over-scores the next PR, which the
# next round corrects. As a GUARD baseline it is worse than that -- the floor is 1% under
# this number, so 46.48 would have admitted a decode collapse to 46.02, a 19% regression,
# while reporting that the guard passed.
#
# 56.8 is from #127's sealed receipt 8641ae28 (56.82 measured against a 46.11 frontier),
# rounded down. Main itself has NOT been measured with #127 in it. Precedent says that is
# close: #114 measured 45.38 and main then measured 44.85; #115 measured 46.49 and main
# measured 46.48.
#
# THE RISK OF SETTING IT HIGH. The slot is raise-only, so if main actually measures under
# the 56.232 floor the bot will not lower it and every PR fails the decode guard until a
# human intervenes. FRONTIER_ALARM (0.90 -> 51.1) would not catch that. This wants a main
# measurement to confirm it.
KIMI_K3_H200X8_IQ1S_SPARKINFER_128K="${KIMI_K3_H200X8_IQ1S_SPARKINFER_128K:-56.8}"

# ---- PREFILL @ 32k — the SCORED metric from 2026-08-05 -----------------------------------
#
# Decode at 128k is now a REGRESSION GUARD, not the tier basis. It was the right thing to
# score while sparkinfer was 18x behind llama.cpp there; at 3.08x ahead the remaining
# headroom is small, and the untouched gap is prompt ingestion.
#
# THERE IS NO BATCHED PREFILL. Every prompt token goes through the single-token decode step,
# so a prompt costs what generating it costs: 32,768 tokens took 812.2 s wall clock on
# main @ 3b6a3f4 (40.35 tok/s), against decode's ~56.8 tok/s. Ingesting is not faster than
# generating, which is the whole opportunity.
#
# llama.cpp reference: llama-bench -p 32768 -n 0 -r 3 -ngl 999 on this node and this GGUF,
# 143.88 +/- 0.23 tok/s (+/-0.16%). It batches the prompt and we do not, so it is 3.57x
# faster here while being 3.08x slower at decode.
KIMI_K3_H200X8_IQ1S_LLAMA_32K_PP="${KIMI_K3_H200X8_IQ1S_LLAMA_32K_PP:-143.88}"
# frontier: rewritten by eval/k3_eval_bot.py each round, raise-only. Do not hand-edit.
# Seeded from the 812.2 s / 32,768-token measurement on main @ 3b6a3f4.
# frontier: measured by eval/k3_eval_bot.py on main @ c1a1642e250b (h200x8, UD-IQ1_S). Do not hand-edit — the bot rewrites this each round.
KIMI_K3_H200X8_IQ1S_SPARKINFER_32K_PP="${KIMI_K3_H200X8_IQ1S_SPARKINFER_32K_PP:-53.02}"

KIMI_K3_H200X8_LLAMA_128="${KIMI_K3_H200X8_LLAMA_128:-0}"
KIMI_K3_H200X8_LLAMA_512="${KIMI_K3_H200X8_LLAMA_512:-0}"
KIMI_K3_H200X8_LLAMA_4K="${KIMI_K3_H200X8_LLAMA_4K:-0}"
KIMI_K3_H200X8_LLAMA_32K="${KIMI_K3_H200X8_LLAMA_32K:-0}"
KIMI_K3_H200X8_LLAMA_1M="${KIMI_K3_H200X8_LLAMA_1M:-0}"
KIMI_K3_H200X8_LLAMA_4K_PP="${KIMI_K3_H200X8_LLAMA_4K_PP:-0}"
KIMI_K3_H200X8_LLAMA_32K_PP="${KIMI_K3_H200X8_LLAMA_32K_PP:-0}"
KIMI_K3_H200X8_LLAMA_1M_PP="${KIMI_K3_H200X8_LLAMA_1M_PP:-0}"

# --- M2: 8x B200 SXM (sm_100) ---
KIMI_K3_B200X8_LLAMA_128="${KIMI_K3_B200X8_LLAMA_128:-0}"
KIMI_K3_B200X8_LLAMA_512="${KIMI_K3_B200X8_LLAMA_512:-0}"
KIMI_K3_B200X8_LLAMA_4K="${KIMI_K3_B200X8_LLAMA_4K:-0}"
KIMI_K3_B200X8_LLAMA_32K="${KIMI_K3_B200X8_LLAMA_32K:-0}"
KIMI_K3_B200X8_LLAMA_1M="${KIMI_K3_B200X8_LLAMA_1M:-0}"
KIMI_K3_B200X8_LLAMA_4K_PP="${KIMI_K3_B200X8_LLAMA_4K_PP:-0}"
KIMI_K3_B200X8_LLAMA_32K_PP="${KIMI_K3_B200X8_LLAMA_32K_PP:-0}"
KIMI_K3_B200X8_LLAMA_1M_PP="${KIMI_K3_B200X8_LLAMA_1M_PP:-0}"

# --- M3: 4x+ B300 (sm_103, UNVERIFIED — confirm compute_cap on first contact) ---
KIMI_K3_B300X4_LLAMA_128="${KIMI_K3_B300X4_LLAMA_128:-0}"
KIMI_K3_B300X4_LLAMA_512="${KIMI_K3_B300X4_LLAMA_512:-0}"
KIMI_K3_B300X4_LLAMA_4K="${KIMI_K3_B300X4_LLAMA_4K:-0}"
KIMI_K3_B300X4_LLAMA_32K="${KIMI_K3_B300X4_LLAMA_32K:-0}"
KIMI_K3_B300X4_LLAMA_1M="${KIMI_K3_B300X4_LLAMA_1M:-0}"
KIMI_K3_B300X4_LLAMA_4K_PP="${KIMI_K3_B300X4_LLAMA_4K_PP:-0}"
KIMI_K3_B300X4_LLAMA_32K_PP="${KIMI_K3_B300X4_LLAMA_32K_PP:-0}"
KIMI_K3_B300X4_LLAMA_1M_PP="${KIMI_K3_B300X4_LLAMA_1M_PP:-0}"

# sparkinfer has no kimi-k3 loader yet (M2/M3 runtime work) — these stay 0 until runtime/
# can load the arch. Same per-node prefixing applies once they are real.
KIMI_K3_H200X8_SPARKINFER_128="${KIMI_K3_H200X8_SPARKINFER_128:-0}"
KIMI_K3_H200X8_SPARKINFER_512="${KIMI_K3_H200X8_SPARKINFER_512:-0}"
KIMI_K3_H200X8_SPARKINFER_4K="${KIMI_K3_H200X8_SPARKINFER_4K:-0}"
KIMI_K3_H200X8_SPARKINFER_32K="${KIMI_K3_H200X8_SPARKINFER_32K:-0}"
