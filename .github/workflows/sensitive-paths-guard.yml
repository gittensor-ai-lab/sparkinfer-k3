name: sensitive-paths-guard

# Blocks any NON-maintainer pull request that modifies scoring / eval / governance paths.
#
# Uses pull_request_target so the workflow ALWAYS runs the version on the protected base
# branch (main) — a fork PR cannot weaken this guard by editing the workflow in its head.
# The job only READS the changed-file list and the PR author (via the API); it never checks
# out or executes PR code, so the elevated pull_request_target token is safe here.
#
# Pair with a branch ruleset on `main` that requires this check to pass.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Block non-maintainer edits to sensitive paths
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUM: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ASSOC: ${{ github.event.pull_request.author_association }}
        run: |
          set -euo pipefail

          # Maintainer allowlist (explicit), plus OWNER/MEMBER association as a fallback.
          MAINTAINERS="ai-hpc"

          # Verdict-determining / governance paths. Keep in sync with .github/CODEOWNERS.
          #
          # RETARGETED FOR THIS REPO. The inherited list guarded all of `bench/scripts/`,
          # which made sense in sparkinfer (where the harness is scoring infrastructure and
          # the product is runtime/). Here the harness IS the deliverable — the entire K3
          # baseline lives in bench/scripts/ — so guarding the whole directory would block
          # every contribution the repo exists to receive.
          #
          # What genuinely determines a verdict here is narrower: the pins and the recorded
          # measurements. Change reference.lock and you change what every future run is
          # scored against; change a weight manifest and you change which bytes count as the
          # baseline; change bench/results/ and you change what `check_reference_lock.py`
          # will accept as provenance for a pinned number.
          # THE SCORING FUNCTION ITSELF WAS NOT GUARDED. The inherited list covered the
          # pins and the recorded measurements but not the code that turns a measurement
          # into a payout tier — label.py IS the verdict (its BUCKETS decide XS..XL and its
          # gates decide REJECT), compare_logits.py IS the accuracy gate label.py trusts,
          # kimi_k3_eval.sh assembles the RESULT_JSON both feed, and
          # check_reference_lock.py is what makes a hand-filled baseline impossible.
          # A contributor able to edit any of those could mint their own tier without
          # touching a single pin. Guarding results but not the scorer is guarding the
          # ledger and leaving the pen on the desk.
          SENSITIVE='^(eval/|\.github/|\.gittensor/|bench/results/|dashboard/data\.json$|bench/scripts/(reference\.lock|label\.py|compare_logits\.py|check_reference_lock\.py|kimi_k3_eval\.sh|kimi_k3_baseline\.sh|kimi_k3_attest\.py|_kimi_k3\.sh|test_kimi_k3_baseline\.py|test_label\.py|kimi_k3_.*\.sha256)$)'

          # Read-only: the changed-file list from the API. Never runs PR code.
          FILES="$(gh pr diff "$NUM" -R "$REPO" --name-only)"
          echo "PR #$NUM by $AUTHOR ($ASSOC)"; echo "--- changed files ---"; echo "$FILES"

          HITS="$(printf '%s\n' "$FILES" | grep -E "$SENSITIVE" || true)"
          if [ -z "$HITS" ]; then
            echo "No sensitive paths touched — OK."; exit 0
          fi
          echo "--- sensitive paths touched ---"; echo "$HITS"

          if printf ' %s ' "$MAINTAINERS" | grep -q " $AUTHOR " || [ "$ASSOC" = "OWNER" ] || [ "$ASSOC" = "MEMBER" ]; then
            echo "Author $AUTHOR ($ASSOC) is a maintainer — allowed."; exit 0
          fi

          echo "::error::PR #$NUM by $AUTHOR ($ASSOC) modifies maintainer-only paths (scoring / eval / governance). Only maintainers may change these. Blocked."
          exit 1
