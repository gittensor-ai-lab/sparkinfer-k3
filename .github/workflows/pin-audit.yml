name: pin-audit

# Watch the two external things the baseline depends on and cannot control:
#   - unslothai/llama.cpp PR #48 (the reference engine) can be force-pushed or merged
#   - unsloth/Kimi-K3-GGUF can re-upload a quant with a different shard count
#
# `ensure_llamacpp` already refuses to run when the ref stops resolving to the pinned sha,
# but only at the moment somebody starts a sweep — i.e. on a rented 8x H200 node, which is
# the worst possible time to discover it. This runs weekly instead, and opens an issue.
#
# Weekly rather than daily: the pins move rarely, and a daily no-op run is just noise in
# the Actions history.

on:
  schedule:
    - cron: "17 7 * * 1"     # Mondays 07:17 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "bench/scripts/reference.lock"
      - "bench/scripts/_kimi_k3.sh"
      - "bench/scripts/audit_baseline_pins.py"
      - ".github/workflows/pin-audit.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: pin-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit external pins
        id: audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          if python3 bench/scripts/audit_baseline_pins.py --token "$GH_TOKEN" 2>&1 | tee audit.txt; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        run: |
          {
            echo '## Baseline pin audit'
            echo
            echo '```'
            cat audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # On a PR, drift is the author's problem to see — fail the check and stop. On the
      # schedule there is no PR to fail, so file an issue instead (and don't pile up
      # duplicates: reuse the open one).
      - name: Fail the PR check on drift
        if: steps.audit.outputs.drift == 'true' && github.event_name == 'pull_request'
        run: |
          echo "::error::baseline pin drift — see the job summary"
          exit 1

      - name: Open or update an issue on drift
        if: steps.audit.outputs.drift == 'true' && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const detail = fs.readFileSync('audit.txt', 'utf8');
            const TITLE = 'baseline pin drift: the Kimi K3 reference moved';
            const MARKER = '<!-- sparkinfer-k3-pin-audit -->';
            const { owner, repo } = context.repo;
            const body = [
              MARKER,
              'The external pins behind the Kimi K3 baseline no longer match reality.',
              '',
              '```',
              detail.trim(),
              '```',
              '',
              'Why this matters: any number pinned in `reference.lock` was measured against the',
              'OLD state. Re-pinning without re-measuring would leave a baseline that cannot be',
              'reproduced from the pinned sources. Review the change, then re-pin deliberately',
              'and re-run the affected sweeps.',
              '',
              `<sub>Automated by pin-audit (${context.workflow} run ${context.runId}).</sub>`,
            ].join('\n');

            const open = await github.paginate(github.rest.issues.listForRepo,
              { owner, repo, state: 'open', per_page: 100 });
            const existing = open.find(i => i.body?.includes(MARKER));
            if (existing) {
              await github.rest.issues.createComment(
                { owner, repo, issue_number: existing.number, body });
              core.notice(`updated issue #${existing.number}`);
            } else {
              const { data } = await github.rest.issues.create(
                { owner, repo, title: TITLE, body });
              core.notice(`opened issue #${data.number}`);
            }
