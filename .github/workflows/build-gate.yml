name: build-gate

# Replaces the inherited `build-attested-binaries` workflow. That one built
# qwen3_gguf_bench for Linux AND Windows at sm_120, attested the binaries, and published
# release tarballs. Three things did not apply here:
#
#   - sm_120 is Blackwell consumer/edge. This repo's nodes are sm_90 / sm_100 / sm_103, so
#     it was compile-checking an architecture nothing here runs on.
#   - Windows. The milestone nodes are Linux HGX boxes.
#   - Release publishing. sparkinfer-k3 ships no binaries; the deliverable is the harness
#     and, later, a native loader. Attesting a Qwen binary from this repo would be noise.
#
# What remains is the part that has value: prove the tree still COMPILES for the milestone
# architectures. That is a genuine regression guard for M2/M3 native work, and it is the
# only GPU-adjacent thing a hosted runner can do — it compiles, it never executes.
#
# Path-filtered, so the harness/docs PRs that make up most of this repo's traffic do not
# pay the CUDA-toolkit install.

on:
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "kernels/**"
      - "moe/**"
      - "runtime/**"
      - ".github/workflows/build-gate.yml"
  push:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "kernels/**"
      - "moe/**"
      - "runtime/**"
      - ".github/workflows/build-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-gate-${{ github.event.pull_request.number || github.ref }}
  # NOT cancel-in-progress. A CUDA install plus a -j2 compile is ~8 minutes per
  # arch, and cancelling on every push meant this job never once reached a verdict
  # across three consecutive commits — it was cancelled twice and its first real
  # result came only after a merge. A stale-but-finished result is more useful than
  # a perpetually-cancelled fresh one.
  cancel-in-progress: false

jobs:
  compile:
    name: compile sm_${{ matrix.arch }} (${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: "90"
            node: M1 · H200 · Hopper
          # sm_100 (M2 · B200) was removed by request. This repo is Hopper-only in practice
          # — CONTRIBUTING says so outright — and there is no Blackwell hardware to run on,
          # so the job was compile-checking an architecture nothing here executes. It cost
          # no PR latency (the matrix ran in parallel with sm_90) but it did assert a scope
          # the project does not have.
          #
          # WHAT WENT WITH IT. The link chain is qwen3_gguf_bench -> sparkinfer_runtime ->
          # sparkinfer_kernels -> si_k3, so that job did compile the real K3 kernels for
          # Blackwell; it was the only thing that would have caught an MLA/MoE change
          # breaking sm_100 before M2 hardware exists. Restore this entry when M2 starts.
          #
          # sm_103 (M3 · B300) is deliberately absent for a different reason. The installed
          # CUDA toolkit must recognise the target or configure fails outright, and 103 is
          # not in the top-level CMakeLists arch list yet — see bench/configs/b300.yaml. Add
          # a matrix entry only once compute_cap is confirmed on real hardware.
    steps:
      - uses: actions/checkout@v4

      # The CUDA 12.8 toolkit does not fit a stock ubuntu-latest runner: the first run of
      # this job died with "Free space left: 0 MB" and sudo exit 15 during install. The
      # inherited workflow had the same shape, so it was equally unable to install — it
      # just was not exercised here before.
      #
      # Reclaim the preinstalled toolchains this build never touches (~25 GB) rather than
      # trimming the toolkit: the build links only CUDA::cudart (+ optional CUDA::nvml,
      # which degrades cleanly), so a sub-package install would also work — but getting the
      # package names wrong fails at link time, whereas freeing disk cannot.
      - name: Reclaim runner disk
        run: |
          set -uo pipefail
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/local/lib/android          # ~9 GB, largest single win
          sudo rm -rf /usr/local/.ghcup              # ~2.7 GB
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/share/dotnet              # ~1.6 GB
          sudo rm -rf /usr/share/swift               # ~1.7 GB
          sudo rm -rf /opt/hostedtoolcache/CodeQL    # ~5 GB
          docker image prune --all --force >/dev/null 2>&1 || true
          echo "after:"; df -h / | tail -1

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: "12.8.1"
          use-github-cache: false
          # Do not spend the disk we just freed on caching the installer tarball.
          use-local-cache: false

      - name: Configure
        run: |
          echo "disk after CUDA install:"; df -h / | tail -1
          nvcc --version | tail -2
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES="${{ matrix.arch }}" \
            -DBUILD_TESTS=OFF \
            -DBUILD_EXAMPLES=ON

      # -j2, matching bench/scripts/_common.sh: cc1plus for a single CUDA arch takes
      # ~2-3 GB, and a hosted runner has 4 cores / 16 GB. -j$(nproc) OOMs.
      - name: Build
        run: cmake --build build -j2 --target qwen3_gguf_bench

      - name: Report
        run: |
          set -euo pipefail
          f=build/runtime/qwen3_gguf_bench
          [ -x "$f" ] || { echo "::error::binary missing after build"; exit 1; }
          echo "sm_${{ matrix.arch }}: $(stat -c%s "$f") bytes"
          # No K3 binary exists yet, so this only proves the inherited Qwen tree still
          # builds for this arch. It is a floor, not coverage of the K3 path.
          echo "::notice::compiled the inherited Qwen runtime for sm_${{ matrix.arch }}; no kimi-k3 loader exists yet"
