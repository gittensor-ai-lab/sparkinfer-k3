name: eval-label

# Applies the eval:XS .. eval:XL tier to a PR from a node run's RESULT_JSON.
#
# WHY THE LABEL IS APPLIED HERE AND NOT COMPUTED HERE. The tier is a deterministic
# function of measurements (bench/scripts/label.py) so independent validators converge
# on the same verdict. But the measurements require an 8x H200 node holding 553 GiB —
# no hosted runner can produce them. So the node runs the eval, and this workflow only
# TRANSCRIBES the verdict onto the PR. It recomputes the label from the reported
# numbers rather than trusting the reported label, so a hand-edited tier is caught.
#
# Trigger it by commenting on the PR with the harness output:
#
#     /eval RESULT_JSON {"commit":"abc1234","tps":3.55,...}
#
# produced by:
#
#     bench/scripts/kimi_k3_eval.sh --node h200x8 --frontier <merged best>
#
# AUTHORIZATION. Only OWNER / MEMBER / COLLABORATOR comments are honoured. Without
# that gate any contributor could comment their own eval:XL onto their own PR, which
# is the whole ballgame in a repo that pays per tier.

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number
        required: true
      result_json:
        description: RESULT_JSON payload from kimi_k3_eval.sh
        required: true

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  label:
    # issue_comment fires for issues too; PR-only, and only on an /eval command.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request != null &&
       startsWith(github.event.comment.body, '/eval'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authorize
        if: github.event_name == 'issue_comment'
        env:
          ASSOC: ${{ github.event.comment.author_association }}
          IS_DRAFT: ${{ github.event.issue.draft }}
        run: |
          # A tier is a payout. Labelling a draft contradicts the rule everywhere else that
          # unfinished work is not evaluated, and it would let a verdict attach to a branch
          # that can still change freely afterwards.
          if [ "$IS_DRAFT" = "true" ]; then
            echo "::error::this PR is a draft — mark it ready for review before running /eval"
            exit 1
          fi
          case "$ASSOC" in
            OWNER|MEMBER|COLLABORATOR) echo "authorized ($ASSOC)" ;;
            *) echo "::error::/eval from $ASSOC is not authorized — the tier decides payout, "\
                    "so only maintainers may post one."; exit 1 ;;
          esac

      - name: Require a verified Polaris receipt
        id: receipt
        env:
          BODY: ${{ github.event.comment.body }}
          DISPATCH_JSON: ${{ github.event.inputs.result_json }}
          REQUIRE_RECEIPT: ${{ vars.REQUIRE_EVAL_RECEIPT }}
        run: |
          set -euo pipefail
          # THE HOLE THIS CLOSES. Re-deriving the tier proves the LABEL follows from the
          # numbers. It proves nothing about where the numbers came from — a RESULT_JSON
          # pasted into a comment is just text. bench/scripts/kimi_k3_attest.py seals a
          # verdict into a Polaris receipt that binds it to the model sha256, the build
          # hash, the code commit and the scoring-scripts commit; this step refuses to
          # label a run that has no such receipt.
          #
          # Gated on the REQUIRE_EVAL_RECEIPT variable so the requirement can be turned on
          # deliberately rather than silently breaking every open PR the moment it merges.
          # Set it to "1" once the eval node is sealing runs.
          if [ "${REQUIRE_RECEIPT:-0}" != "1" ]; then
            echo "::notice::REQUIRE_EVAL_RECEIPT is not set — labelling WITHOUT attestation."
            echo "  The verdict is unverified: nothing binds these numbers to a real run."
            echo "required=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          RAW="${DISPATCH_JSON:-$BODY}"
          RID="$(printf '%s' "$RAW" | sed -n 's/.*"receipt_id"[[:space:]]*:[[:space:]]*"\([0-9a-f]\{8,\}\)".*/\1/p' | head -1)"
          if [ -z "$RID" ]; then
            echo "::error::no receipt_id in the payload. Seal the run first:"
            echo "  bench/scripts/kimi_k3_attest.py --result RESULT.json --model <first-shard.gguf>"
            echo "then post the RESULT_JSON together with its receipt_id."
            exit 1
          fi
          echo "receipt_id=$RID" >> "$GITHUB_OUTPUT"
          echo "required=1" >> "$GITHUB_OUTPUT"
          echo "receipt $RID present — verifying against the log"

      - name: Verify the receipt in sparkinfer-k3-log
        if: steps.receipt.outputs.required == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          RID: ${{ steps.receipt.outputs.receipt_id }}
        run: |
          set -euo pipefail
          # The receipt must already be COMMITTED to the append-only log. Accepting one
          # pasted inline would just move the forgeable surface from the numbers to the
          # receipt; requiring it in a separate repo the scored repo cannot rewrite is the
          # point of having a log at all.
          if ! gh api "repos/gittensor-ai-lab/sparkinfer-k3-log/contents/runs/$RID/receipt.json" \
                 --jq '.name' >/dev/null 2>&1; then
            echo "::error::receipt $RID is not in gittensor-ai-lab/sparkinfer-k3-log."
            echo "Commit runs/$RID/{result,attestation,receipt}.json to the log first."
            exit 1
          fi
          gh api "repos/gittensor-ai-lab/sparkinfer-k3-log/contents/runs/$RID/receipt.json" \
            --jq '.content' | base64 -d > /tmp/receipt.json
          python3 - <<'PY'
          import json, sys
          sys.path.insert(0, "eval")
          from polaris.verify import verify_strict, load_trusted_key
          from polaris.receipt import ReceiptValidator
          r = json.load(open("/tmp/receipt.json"))
          # THE TRUST ANCHOR IS THE REPO'S PINNED KEY, NOT THE RECEIPT'S OWN. A receipt
          # carries its public_key so it stays verifiable after rotation, but checking a
          # signature only against the embedded key proves integrity, not origin — anyone
          # can mint a self-consistent receipt with a key they generated. The signer that
          # counts is the eval bot, and its public key is committed here.
          key = load_trusted_key("eval/polaris/sparkinfer_eval.pub")
          # require_pinned_clocks=False: the K3 box cannot lock GPU clocks in-container,
          # and its sealer says so honestly (kimi_k3_attest.py records clocks_pinned=False
          # plus the measured MHz). Requiring the pin would reject every receipt the
          # repo's own sealer produces; the tier basis is same-box llama.cpp, so the
          # comparison survives an unpinned clock in a way a cross-box one would not.
          problems = verify_strict(r, ReceiptValidator(r), trusted_key_b64=key,
                                   require_pinned_clocks=False)
          if problems:
              # Under-provenanced is not the same as fraudulent, but it is not scorable
              # either — a wrong signer or a missing model sha means nothing binds these
              # numbers to a real run on the pinned weights.
              print("::error::receipt failed strict verification:")
              for p in problems:
                  print(f"  {p}")
              sys.exit(1)
          print(f"receipt verifies: {r.get('attestation_type')} / {r.get('receipt_id')}")
          PY

      - name: Extract and re-derive the verdict
        id: verdict
        env:
          BODY: ${{ github.event.comment.body }}
          DISPATCH_JSON: ${{ github.event.inputs.result_json }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if [ -n "${DISPATCH_JSON:-}" ]; then RAW="$DISPATCH_JSON"; else RAW="$BODY"; fi
          PR_HEAD_SHA="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" -q .head.sha 2>/dev/null || true)"
          export PR_HEAD_SHA
          PAYLOAD="$(printf '%s' "$RAW" | sed -n 's/.*RESULT_JSON[[:space:]]*\({.*}\).*/\1/p' | head -1)"
          if [ -z "$PAYLOAD" ]; then
            echo "::error::no RESULT_JSON found. Post the output of bench/scripts/kimi_k3_eval.sh"
            exit 1
          fi
          # RE-DERIVE rather than trust. label.py is deterministic, so recomputing from the
          # reported measurements must reproduce the reported label; if it does not, the
          # payload was edited between the node and the comment.
          python3 - "$PAYLOAD" "$PR_HEAD_SHA" <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, subprocess, sys
          d = json.loads(sys.argv[1])
          head_sha = (sys.argv[2] or "").strip()
          claimed = d.get("label", "")
          need = ["tps", "top1", "kl", "commit"]
          missing = [k for k in need if k not in d]
          if missing:
              print(f"::error::RESULT_JSON missing {missing}", file=sys.stderr); sys.exit(1)

          # --- bind the payload to THIS pull request -------------------------------
          # Without this, a RESULT_JSON (and its receipt) measured on any branch labels any
          # PR. The commit the node actually evaluated must be the commit under review.
          rc = str(d["commit"]).strip().lower()
          if not head_sha:
              print("::error::could not resolve PR head sha", file=sys.stderr); sys.exit(1)
          if not (head_sha.startswith(rc) or rc.startswith(head_sha[:len(rc)])) or len(rc) < 7:
              print(f"::error::RESULT_JSON commit {rc!r} is not this PR's head {head_sha[:12]!r} — "
                    f"a result measured on another commit cannot label this one",
                    file=sys.stderr)
              sys.exit(1)

          # --- take the tier denominators from TRUSTED main, never the payload ------
          # frontier_tps and llama_ref set the basis the gain is measured against, so a
          # payload that supplies them is a payload that sets its own tier: understate the
          # frontier and any speed looks like a large win. This checkout is the base branch
          # (issue_comment checks out the default branch), so reference.lock here is the
          # protected copy, not the PR's.
          node = re.sub(r"[^A-Za-z0-9]", "", str(d.get("node", "h200x8"))).upper()
          quant = re.sub(r"[^A-Za-z0-9]", "",
                         re.sub(r"^UD-", "", str(d.get("quant", "UD-IQ1_S")))).upper()
          # reference.lock stores each slot as NAME="${NAME:-VALUE}" so an exported env var
          # wins when the harness sources it. Here we want the PINNED value specifically, so
          # read the default out of the file rather than sourcing it.
          lock = {}
          for line in open("bench/scripts/reference.lock"):
              m = re.match(r'\s*(?:export\s+)?([A-Z0-9_]+)="?\$\{[A-Z0-9_]+:-([^}"]*)\}"?', line)
              if m: lock[m.group(1)] = m.group(2).strip()
          # 128K, not 128: the scored context is 131,072. Both denominators must come from
          # the same context as the measurement, or the tier is arithmetic over unrelated
          # numbers. Keep this suffix in step with kimi_k3_eval.sh's CTX_SUFFIX and
          # k3_eval_bot.py's CTX_SUFFIX. Scored metric moved to prefill @32k on 2026-08-05;
          # decode at 128k is now a regression guard in the harness, not the tier basis.
          def slot(kind):
              pfx = f"KIMI_K3_{node}"
              for key in (f"{pfx}_{quant}_{kind}_32K_PP", f"{pfx}_{kind}_32K_PP"):
                  v = lock.get(key, "")
                  try:
                      if v and float(v) > 0: return float(v)
                  except ValueError: pass
              return 0.0
          frontier = slot("SPARKINFER")
          ref = slot("LLAMA")
          if not ref:
              print(f"::error::no llama reference pinned for {node}/{quant} in reference.lock — "
                    f"the tier basis is unset, refusing to score", file=sys.stderr)
              sys.exit(1)
          claimed_f = float(d.get("frontier_tps", frontier) or frontier)
          if frontier and abs(claimed_f - frontier) > max(0.01, 0.01 * frontier):
              print(f"::warning::payload frontier_tps={claimed_f} differs from pinned "
                    f"{frontier}; using the pinned value", file=sys.stderr)
          # stdout of this heredoc IS $GITHUB_OUTPUT, so anything that is not key=value
          # goes to stderr or it corrupts the step outputs.
          print(f"::notice::tier basis from reference.lock — frontier={frontier} "
                f"llama_ref={ref}", file=sys.stderr)

          env = dict(os.environ)
          env["SPARKINFER_DIFFICULTY_REF"] = str(ref)
          # Same bars the harness used. label.py's defaults are the Qwen track's (0.20)
          # and must stay loose for it; K3 pins 0.05. If these two ever disagree the
          # workflow re-derives a different verdict from the same numbers.
          #
          # THESE ARE THE TRUSTED VALUES. The harness's are env-overridable (KIMI_K3_KL_BAR),
          # so a box can run with a looser bar and produce a verdict this job cannot
          # reproduce. It records what it used, so check that FIRST -- otherwise the only
          # symptom is a label mismatch blamed on an edited payload.
          KL_BAR, KL_PREFER = "0.05", "0.02"
          for key, pinned in (("kl_bar", KL_BAR), ("kl_prefer", KL_PREFER)):
              used = d.get(key)
              if used is None:
                  print(f"::warning::payload does not record {key}; it predates the pin or "
                        f"was produced by a different harness", file=sys.stderr)
              elif abs(float(used) - float(pinned)) > 1e-9:
                  print(f"::error::the node scored with {key}={used} but this repo pins "
                        f"{pinned}. The verdict was computed under a different accuracy "
                        f"policy — re-run the eval without KIMI_K3_{key.upper()} set.",
                        file=sys.stderr)
                  sys.exit(1)
          env["SPARKINFER_KL_BAR"] = KL_BAR
          env["SPARKINFER_KL_PREFER"] = KL_PREFER
          # speed_source is only a record if a wrong value is refused. The harness writes
          # the truthful name for its one measured path; "wall_clock_differential" is the
          # same bounded path under its old (misleading) name, kept so pre-rename payloads
          # in the log stay scorable. Anything else means the number was not produced by
          # the harness's guarded path and must not be labelled.
          SPEED_SOURCES_OK = {"self_report_wall_clock_bounded", "wall_clock_differential"}
          src = d.get("speed_source")
          if src is None:
              print("::warning::payload does not record speed_source; it predates the "
                    "recording or was produced by a different harness", file=sys.stderr)
          elif src not in SPEED_SOURCES_OK:
              print(f"::error::speed_source={src!r} is not a value the harness's guarded "
                    f"path produces ({sorted(SPEED_SOURCES_OK)}). The speed was measured "
                    f"some other way — refusing to label it.", file=sys.stderr)
              sys.exit(1)
          out = subprocess.run(
              [sys.executable, "bench/scripts/label.py", str(d["tps"]), str(frontier),
               "0", str(d["top1"]), str(d["kl"]), str(d["commit"])],
              capture_output=True, text=True, env=env, check=True).stdout
          re_d = json.loads(out.split("RESULT_JSON", 1)[1].strip())
          derived = re_d.get("label", "")
          if claimed and claimed != derived:
              print(f"::error::reported label {claimed!r} != re-derived {derived!r} from the same "
                    f"numbers — payload edited or harness version mismatch", file=sys.stderr)
              sys.exit(1)
          print(f"label={derived}")
          print(f"tps={d['tps']}")
          print(f"top1={d['top1']}")
          print(f"kl={d['kl']}")
          print(f"pct={re_d.get('pct_over_frontier', '')}")
          print(f"reason={re_d.get('reason', '') or re_d.get('note', '')}")
          PY

      - name: Apply the tier
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number || github.event.inputs.pr }}
          LABEL: ${{ steps.verdict.outputs.label }}
          TPS: ${{ steps.verdict.outputs.tps }}
          TOP1: ${{ steps.verdict.outputs.top1 }}
          KL: ${{ steps.verdict.outputs.kl }}
          PCT: ${{ steps.verdict.outputs.pct }}
          REASON: ${{ steps.verdict.outputs.reason }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Clear any previous tier first: two eval:* labels on one PR is ambiguous, and
          # a re-eval after a rebase must supersede rather than accumulate.
          for l in $(gh pr view "$PR" --repo "$REPO" --json labels -q '.labels[].name' | grep '^eval:' || true); do
            gh pr edit "$PR" --repo "$REPO" --remove-label "$l" || true
          done

          TIER="$(printf '%s' "$LABEL" | tr 'A-Z' 'a-z')"
          NEW="eval:$TIER"
          # Create on demand so a fresh repo does not need the label set seeded by hand.
          gh label create "$NEW" --repo "$REPO" --color BFD4F2 \
            --description "deterministic eval tier from bench/scripts/label.py" 2>/dev/null || true
          gh pr edit "$PR" --repo "$REPO" --add-label "$NEW"

          {
            echo "### eval: \`$LABEL\`"
            echo
            echo "| metric | value |"
            echo "|---|--:|"
            echo "| decode tok/s | $TPS |"
            echo "| % over frontier | $PCT |"
            echo "| top-1 vs llama.cpp | $TOP1 |"
            echo "| mean KLD vs llama.cpp | $KL |"
            [ -n "$REASON" ] && echo "| note | $REASON |"
            echo
            echo "Re-derived from the posted measurements with \`bench/scripts/label.py\`;"
            echo "the tier is a deterministic function of them, not of the reported label."
          } > /tmp/body.md
          gh pr comment "$PR" --repo "$REPO" --body-file /tmp/body.md
