name: cap-open-prs

# STRICT: ONE open pull request per contributor. Merge one by one.
#
# A contributor who opens a second PR while the first is still open has it closed
# automatically with an explanation. This is not only anti-spam: the eval loop scores a
# PR against the MERGED frontier, so two open PRs from one author are measured against a
# baseline that the other one is about to move. Serialising them is what makes the
# marginal-gain number mean anything.
#
# WHICH ONE SURVIVES. The PR that has been MEASURED wins, then the oldest. Node time is the
# scarce thing here: a PR carrying an eval:* tier has had ~40 minutes of 8x H200 spent on it
# and has a live number against the current frontier, so closing it in favour of an unmeasured
# sibling throws that away and forces a re-run. Only when neither is measured does age decide.
#
#  - pull_request_target(opened/reopened/ready_for_review): enforces the cap for that author.
#    (pull_request_target runs in the base-repo context so the token can close FORK PRs.)
#
#    ready_for_review IS THE ONE THAT MATTERS. Drafts deliberately do not count toward the
#    cap, so without it the rule is trivially evaded: open the first PR as a DRAFT, open a
#    second normally (the cap sees one non-draft and passes), then mark the draft ready --
#    which fires ready_for_review, not opened, so nothing re-checked. That is exactly how
#    widecloud came to hold #52 and #57 open at once.
#  - workflow_dispatch: one-off sweep over ALL authors — use it to clear an existing backlog.
#
# Safe by design: it never checks out or runs PR code — it only calls the GitHub API.

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      max:
        description: "Max open PRs allowed per contributor"
        default: "1"
        required: false

permissions:
  pull-requests: write
  issues: write

concurrency:
  group: cap-open-prs
  cancel-in-progress: false

jobs:
  cap:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce per-author open-PR cap
        uses: actions/github-script@v7
        env:
          MAX_OPEN: ${{ github.event.inputs.max || '1' }}
        with:
          script: |
            const MAX = parseInt(process.env.MAX_OPEN, 10) || 1;
            const { owner, repo } = context.repo;
            const isSweep = context.eventName === 'workflow_dispatch';

            // Never touch these accounts.
            const EXEMPT_LOGIN = new Set(['ai-hpc']);
            const EXEMPT_ASSOC = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);

            // All open PRs (author_association is included on each item).
            const allOpen = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100,
            });
            // Drafts are explicitly unfinished work. Counting one toward the cap means a
            // contributor who opens a draft to park an idea has it auto-closed, and the
            // cap exists to keep the marginal-gain measurement meaningful -- a draft is
            // not being measured, so it cannot distort anything.
            const all = allOpen.filter(p => !p.draft);
            const skipped = allOpen.length - all.length;
            if (skipped) core.info(`ignoring ${skipped} draft PR(s) — drafts do not count toward the cap`);

            // Which authors to enforce this run.
            const authors = isSweep
              ? [...new Set(all.map(p => p.user.login))]
              : [context.payload.pull_request.user.login];

            let closed = 0;
            for (const author of authors) {
              const mine = all.filter(p => p.user.login === author);
              const sample = mine[0];
              if (!sample) continue;
              if (EXEMPT_LOGIN.has(author)) continue;
              if (sample.user.type === 'Bot') continue;
              // If any of their PRs shows maintainer association, treat them as a maintainer.
              if (mine.some(p => EXEMPT_ASSOC.has(p.author_association))) continue;
              if (mine.length <= MAX) continue;

              // Keep the MEASURED ones first, then the oldest. A PR with an eval:* tier
              // has had ~40 minutes of 8x H200 spent on it and holds a live number against
              // the current frontier; closing it in favour of an unmeasured sibling discards
              // that and forces a re-run. Age only decides among equals.
              const scored = p => (p.labels || []).some(l => l.name.startsWith('eval:') &&
                                                             l.name !== 'eval:none');
              mine.sort((a, b) => (scored(b) - scored(a)) || (a.number - b.number));
              const excess = mine.slice(MAX);
              for (const p of excess) {
                try {
                  await github.rest.issues.createComment({
                    owner, repo, issue_number: p.number,
                    body:
                      `Auto-closed to keep the review queue manageable.\n\n` +
                      `**@${author}** has more than the limit of **${MAX} open pull requests** in this ` +
                      `repository (${mine.length} open). Please get some of your open PRs reviewed, merged, ` +
                      `or closed, then **reopen this one** — a smaller set gets reviewed much faster.\n\n` +
                      `<sub>Automated by the per-author open-PR cap. Maintainers are exempt.</sub>`,
                  });
                  await github.rest.pulls.update({
                    owner, repo, pull_number: p.number, state: 'closed',
                  });
                  closed++;
                  core.info(`closed #${p.number} (@${author}, ${mine.length} open, cap ${MAX})`);
                } catch (e) {
                  core.warning(`#${p.number}: ${e.message}`);
                }
              }
            }
            core.notice(`cap-open-prs: closed ${closed} PR(s) over the cap of ${MAX}.`);
