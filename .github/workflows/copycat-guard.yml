name: copycat-guard
# Real-time copycat detection — fires the instant a PR is opened (pull_request_target
# runs from the BASE branch context, so it has full repo access to read all PRs, label,
# comment, and close). Tiered detection (eval/copycat_policy.py):
#   ≥85% containment -> block+close
#   75-84% containment -> copycat-warn + comment
#   ≥92% per-function containment -> copycat-warn only (never block alone; PR-level ≥85% required)
#   3 warnings -> block+close

# NOTE FOR THIS REPO: the guard needs an OPENAI_API_KEY secret, which sparkinfer-k3 does
# not have. It passed on PR #1 only because the author_association check skipped it for a
# MEMBER — the first external PR would have run it and failed on the missing key. The job
# now checks for the secret and skips cleanly when it is absent, so a missing secret is a
# visible skip rather than a red check nobody can fix.
#
# Whether this guard is wanted here at all is a separate question: it exists to police
# plagiarism between competing SN74 miners, and this is a private repo. Left wired up
# rather than deleted, because that decision belongs to a maintainer.

on:
  pull_request_target:
    # ready_for_review so a PR opened as a draft is still scanned once it is real.
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: write          # push policy files
  pull-requests: write     # label + comment + close
  issues: write            # PR comment

jobs:
  guard:
    name: copycat-guard
    runs-on: ubuntu-latest
    # Skip maintainer PRs, and skip drafts. A draft is unfinished work, and the >=90% tier
    # of this guard adds the author to the denylist permanently -- taking that action on a
    # branch someone has explicitly marked not-ready is the one mistake here that cannot be
    # walked back. It is re-checked when the PR is marked ready_for_review.
    if: >-
      github.event.pull_request.draft != true &&
      github.event.pull_request.author_association != 'OWNER' &&
      github.event.pull_request.author_association != 'MEMBER' &&
      github.event.pull_request.author_association != 'COLLABORATOR'
    steps:
      - name: Check for the LLM key
        id: key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YUNWEI_API_KEY: ${{ secrets.YUNWEI_API_KEY }}
          COPYCAT_LLM_PROVIDER: ${{ vars.COPYCAT_LLM_PROVIDER }}
        run: |
          if [ -n "${OPENAI_API_KEY:-}" ] || [ -n "${YUNWEI_API_KEY:-}" ]; then
            echo "have_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no LLM key (OPENAI_API_KEY / YUNWEI_API_KEY) — containment tiers still run; only the 50-70% judge band is skipped."
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run copycat guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YUNWEI_API_KEY: ${{ secrets.YUNWEI_API_KEY }}
          COPYCAT_LLM_PROVIDER: ${{ vars.COPYCAT_LLM_PROVIDER || 'openai' }}
          COPYCAT_LLM_MODEL: gpt-4o-mini
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          PR_NUM="$PR_NUM" python3 eval/copycat_guard.py
